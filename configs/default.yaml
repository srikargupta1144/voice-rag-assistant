# Defaults for every setting group. Override any value with an env var:
# VRA_<GROUP>__<FIELD>, for example VRA_LLM__PROVIDER=openai or VRA_LLM__MODEL=llama3.1:8b.
# Secrets (API keys) never go in this file.
log_level: INFO
paths:
  docs_dir: data/docs
  index_dir: data/index
  models_dir: models
chunking:
  chunk_tokens: 500
  overlap_tokens: 50
embedding:
  model: BAAI/bge-small-en-v1.5
retrieval:
  candidates: 20
  rrf_k: 60
  rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  rerank_candidates: 20
  top_k: 5
  context_k: 3
  not_found_threshold: 1.5
vector_store:
  backend: auto
  pinecone_index: voice-rag-assistant
  pinecone_namespace: default
llm:
  provider: ollama
  model: llama3.2:3b
  ollama_url: http://localhost:11434
  openai_base_url: https://api.openai.com/v1
  openai_model: gpt-4o-mini
  temperature: 0.1
  max_tokens: 300
  timeout_s: 90
  few_shot: true
rewrite:
  mode: auto
stt:
  model_size: small
  model_dir: models/faster-whisper-small
  compute_type: int8
  language: en
  beam_size: 1
  vad: true
  initial_prompt: Acme Mutual, Kova Bank, Kova Rewards card, Everyday Checking.
tts:
  voice: en_US-lessac-medium
  voice_dir: models/piper
api:
  request_timeout_s: 120
  warm_up: true
  max_upload_mb: 10
