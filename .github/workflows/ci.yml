# CI: lint and unit tests on every push and pull request, then the retrieval quality gate:
# build the index from data/docs, measure Recall@5 on eval/questions.jsonl and fail when it
# drops below eval/baseline.json. No LLM runs in CI (the free runners cannot host one);
# answer-quality evaluation runs locally with Ollama.

name: ci

on:
  push:
    branches: [main]
  pull_request: {}

env:
  KMP_DUPLICATE_LIB_OK: "TRUE"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  retrieval-gate:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache embedding and re-ranker models
        uses: actions/cache@v4
        with:
          path: models/hf
          key: hf-${{ hashFiles('configs/default.yaml') }}
      - run: uv run python -m scripts.download_models --skip-voice
      - run: uv run vra ingest
      - run: uv run python -m eval.retrieval_eval --out eval/results/retrieval_ci.json
      - run: uv run python -m eval.gate --results eval/results/retrieval_ci.json --baseline eval/baseline.json
