# CI: lint and the fast unit tests (with a coverage report) on every push and pull request,
# then the retrieval quality gate: build the index from data/docs, measure Recall@5 on
# eval/questions.jsonl and fail when it drops below eval/baseline.json. No LLM runs in CI
# (the free runners cannot host one); answer-quality evaluation and the "llm" tests run
# locally with Ollama.

name: ci

on:
  push:
    branches: [main]
  pull_request: {}

env:
  KMP_DUPLICATE_LIB_OK: "TRUE"
  HF_HUB_DISABLE_TELEMETRY: "1"
  # Copy packages into .venv instead of hard-linking them from the uv cache. Recent NLTK
  # refuses to open any data file with more than one hard link (st_nlink > 1), which broke
  # LlamaIndex sentence splitting in CI. The Dockerfile sets the same option.
  UV_LINK_MODE: copy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Fast suite only (markers models and llm are excluded by default), with coverage.
      - run: uv run pytest --cov --cov-report=term-missing

  retrieval-gate:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache embedding and re-ranker models
        uses: actions/cache@v4
        with:
          path: models/hf
          key: hf-${{ hashFiles('configs/default.yaml') }}
      - run: uv run python -m scripts.download_models --skip-voice
      - run: uv run vra ingest
      - run: uv run python -m eval.retrieval_eval --out eval/results/retrieval_ci.json
      - run: uv run python -m eval.gate --results eval/results/retrieval_ci.json --baseline eval/baseline.json
